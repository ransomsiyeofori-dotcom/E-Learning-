  <div class="div">
 <label for="password">Password</label>

 </div>
<div class="check">

 <button class="btn2" id="closeBtn">Close</button>

</div>

 
 
   
   
 
 
    
<button type="submit" class="button" id="submitBtn"><span id="btnText">Login</span>

</button>
