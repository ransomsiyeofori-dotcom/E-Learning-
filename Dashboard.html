<!doctype.html>
   <html lang="en">
    <head><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=add" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Dancing+Script:wght@400..700&family=Playwrite+DE+SAS:wght@100..400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard</title>
    <style>
    body { margin: 0px;}
    
/*---------Header------------*/
           
      header { position: fixed;
            left: 0px; top: 0px;
            height: 80px;
            width: 100%;
            background: purple;
            box-shadow: 0 0 15px purple;
            display: flex;
            align-items: center;
            padding-left: 5px;
            padding-right: 5px;
            justify-content: space-between;}

.btn { height: 30px;
       width: 50px;
       background: coral;
       color: white;
       border-radius: 10px;
       border-style: none;
       cursor: pointer;
       transition: 0.5s ease;}

.btn:hover { background: gray;
             transform: scale(1.01);}
#span { font-size: 3rem;
    color: white;}
.search { height: 30px;
          border-style: none;
          border-radius: 5px;
          outline: none;}
          
.search:focus { border: 2px solid seagreen;}
             
/*----------Nav---------------*/

.nav { height: 100%;
      width: 80%;
      background: purple;
      position: fixed;
      left: 0px; top: 80px;
      box-shadow: 0 0 15px purple;
      transform: translateX(-100%);
      transition: 0.9s ease;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 30px;
      padding: 10px;}
      
.nav.active {transform: translateX(0%);}

.btn1 { display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    width: 60%;
    height: 2rem;
    border-style: none;
    background: transparent;
    transition: 0.5s ease;
    color: white;
    font-size: 15px;
}

.container { display: flex;
             justify-content: center;
             align-items: center;
             gap: 20px;
}
          

/*------------Main--------------*/
main { display: flex;
       flex-direction: column;
       align-items: center;
       margin-top: 80px;}
.h1 { text-align: center;}

/*----------------Footer--------------*/
.footer { position: fixed;
          bottom: 0px; left: 0px;
          width: 100%;
          height: 5rem;
          background: purple;
          display: flex;
          align-items: center;
          justify-content: space-evenly;}

.footer-icon { display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;}
          
#footer-download {font-size: 3rem;
    color: white;}
    
#footer-not {font-size: 3rem;
             color: white;}
             
#btn { background: transparent;
       border-radius: 50%;
      border-style: none;
      transition: 0.5s ease;}
      
#btn:hover { background: coral;
            transform: scale(1.01);}

.profile { height: 50px;
           width: 50px;
           border-radius: 50%;}
             
             


       
       
      
    </style>
</head>
<body>
  
  <!------------Header section---------->
  
  <header>
   
    <input type="file" accept="image/*" id="profile" class="profile">
    
    <input type="text" class="search" placeholder="search">

 <span  class="material-symbols-outlined" id="span">menu</span>
    
   </header>
   
<!----------Nav---------------------->
<nav id="nav" class="nav">
 <div class="container">
   <span> 🏠</span>
<button class="btn1">Dashboard</button>
</div>
<div class="container">
  <span>📚</span>
<button class="btn1">My Courses</button>
</div>
<div class="container">
  <span>📅</span>
<button class="btn1">Schedule</button>
</div>
<div class="container">
  <span>📝</span>
<button class="btn1">Assignments</button>
</div>
<div class="container">
  <span>📈</span>
<button class="btn1">Progress</button>
</div>
<div class="container">
  <span>💬</span>
<button class="btn1">Messages</button>
</div>
<div class="container">
  <span>📥</span>
<button class="btn1">Resources</button>
</div>
<div class="container">
  <span>👤</span>
<button class="btn1">Profile</button>
</div>
  
</nav>

<!--------------Main--------------->
<main>
  <h1 class="h1">Welcome, <span id="username"></span>
  </h1>
</main>

<footer class="footer">
  
  <button id="btn">
    <span id="span" class="material-symbols-outlined">Logout
</span>
</button>

<button id="btn">
<span id="footer-download" class="material-symbols-outlined">
download
</span>
</button>

<button id="btn">
  <span id="footer-not" class="material-symbols-outlined">
notifications
</span>
</button>
</footer>
  
  

<script src="Dashboard.js"></script>
</body>
</html>
