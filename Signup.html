</head>
<body>
  <! header section >

    <img src="hub.png" alt="logo" width="100px" height="80px">

    <span class="material-icons" id="search-icon">search</span> 
     <span id="menu" class="material-icons"> menu</span>
     </div>
     </header>
     
  <!---------Navigation Section-------->
  
<nav id="nav"> 
<a href="index.html"><button class="btn"> <span class="material-icons">home</span>Home</button></a>
<a href="tutors.html"><button class="btn"><span class="material-icons">school</span>Our Tutors</button></a>

<div class="login-section">

    <a href="Signup.html"><button id="btn1">Sign Up</button></a>
</div>

<!-----------Main--------->

<main class="main">
  <div class="modal" id="modal">
    <img src="emoji.png" width="100px" height="100px">
    <h2 class="h2">Successful</h2>
    <p class="p">Account Created</p>
    <button id="Btn">Close</button>
 </div>
  <form id="myForm" class="form1">
    <h2>Sign Up</h2>
    <div class="container">
      <label for="fullname">Fullname</label>
  <input type="text" placeholder="Enter fullname" id="fullname" class="input1">
  <small id="fullnameError"></small>
    </div>
    
        <div class="container">
      <label for="email">Email</label>
  <input type="email" placeholder="Enter email" id="email" class="input1">
  <small id="emailError"></small>
    </div>
    
        <div class="container">
      <label for="phone">Phone</label>
  <input type="text" placeholder="Enter phone" id="phone" class="input">
  <small id="PhoneError"></small>
    </div>
    
    <div class="container">
      <label for="dateofbirth">Date of birth</label>
  <input type="date" id="dateOfBirth" class="input1">
  <small id="dateError"></small>
    </div>
    
        <div class="container">
      <label for="password">Password</label>
  <input type="password" placeholder="Enter Password" id="password" class="input1">
  <small id="PasswordError"></small>
    </div>
  
  <div class="item">
       <input type="checkbox" value="yes">
      <label for="Affirmation">I understand that every session begins with positive affirmations and prayer to build my child’s confidence and focus</label>
   </div>
  
  <button type="submit" class="btn1">Sign Up</button>
  <!-- Spinner -->
<div id="spinner" class="spinner-container">
  <div class="loader"></div>
</div>

 <p>Have an account? <strong><a href="Login.html">Login</a></strong></p>
    
    
    
    
  </form>
  
</main>

  <script src="https://cdn.jsdelivr.net/npm/intl-tel-input@18.1.1/build/js/intlTelInput.min.js"></script>
