<! Main Section >
<main class="main">
<div class="toggle-search" id="search" >    <input type="text" id="search" placeholder="search"/> </div>

<! form section>
  <form id="myForm">
  
       <h2>Students & Parents Info</h2>
    <div class="item">
    <label for="parents">Parents Name</label>
<input type="text" placeholder="Parent/Guardian..." class="input" id="parent"> <small id="parentError"></small>
</div>
      
      <div class="item">
    <label for="students">Student's Name</label>
    <input type="text" placeholder="Name of Student..." class="input" id="Student">
    <small id="studentError"></small>
      </div>
    

    <div class="item">
 <label for="contact">Whatsapp Number</label>
    <input type="text" placeholder="Whatsapp" class="input" id="whatsapp">
    <small id="whatsappError"></small>
    </div>
    
    <div class="item">
    <label for="tel">Phone</label>
    <input type="tel" placeholder=phone class="input" id="phone">
    <small class="phoneError"></small>
    </div>
    
    <div class="item">
    <label for="email">email</label>
    <input type="text" placeholder="Enter your email" class="input" id="email">
    <small class="emailError"></small>
    </div>
    
    
    <div class="item">
      <label for="Select">Mode</label>
    <select class="input">
      <option  value=""> Select Location</option>
      <option>Physical</option>
      <option>Online</option>
    </select>
    </div>

    
    
      <h2>Subject Info</h2>
      
       <div class="item">
   <label for="student-level">Student Level</label>
  <select class="input">
    <option>Select Level</option>
    <option>Basic(Grade) 1</option>
    <option>Basic(Grade) 2</option>
    <option>Basic(Grade) 3</option>
    <option>Basic(Grade) 4</option>
    <option>Basic(Grade) 5</option>
    <option>Basic(Grade) 6</option>
    <option>Basic(Grade) 7</option>
    <option>Basic(Grade) 8</option>
    <option>Basic(Grade) 9</option>
  </select>
    </div>
      
      <div class="item">
          <label for="Mathematics">Subject</label>
      <select class="input">
        <option>Select Subject</option>
    <option value="Mathematics">Mathematics</option>
  <option value="English">English</option>
 <option value="French">French</option> </select>
      </div>
      
      
      <div class="item">
   <label for="Focus">Specific Focus</label>
   <select class="input">
     <option value="">Select Focus</option>
 </select>
 </div>

    <div class="Schedule">
      <h2>Schedule</h2>
        </div>
        
          <div class="item">
    <label for="timeslots">Time Slots</label>
    <select class="input">
      <option>Select Slot</option>
      <option>Morning</option>
      <option>Afternoon</option>
      <option>Evening</option>
       </select>
     </div>
    
     <div class="item">
       
     <label for="prefferdays">Prefferred Days</label>
 <div class="check">
  <div class="checkbox">
  <label for="monday">Monday</label>
  <input type="checkbox" value="yes">  
      </div>
  
     
  <div class="checkbox">
  <label for="tuesday">Tuesday</label>
  <input type="checkbox" value="yes">  
      </div>
      
       
  <div class="checkbox">
  <label for="wednesday">Wednesday</label>
  <input type="checkbox" value="yes">  
      </div>
  
       
  <div class="checkbox">
  <label for="thursday">Thursday</label>
  <input type="checkbox" value="yes">  
      </div>
    
       
  <div class="checkbox">
  <label for="friday">Friday</label>
  <input type="checkbox" value="yes">  
      </div>
  </div>
  </div>
 
 
  <div class="item">
    <div>
       <input type="checkbox" value="yes">
      <label for="Affirmation">I understand that every session begins with positive affirmations and prayer to build my child’s confidence and focus</label>
     </div>
    </div>
